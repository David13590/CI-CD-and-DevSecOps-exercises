name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build
          path: |
            OrderManagement.Api/bin/Debug/
            OrderManagement.Api/obj/
            OrderManagement.Tests/bin/Debug/
            OrderManagement.Tests/obj/
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build
          path: .

      - name: Run unit tests
        run: dotnet test --no-build --no-restore